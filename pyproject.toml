[project]
name = "fdasrsf"
version = "2.7.2"
description = "functional data analysis using the square root slope framework"
authors = [
	{name = "J. Derek Tucker", email = "jdtuck@sandia.gov"}
]
license = {text = "BSD 3-Clause"}
readme = "README.md"
requires-python = ">=3.10"

keywords = ["functional data analysis"]

dependencies=[
        "Cython",
        "matplotlib",
        "numpy>=1.25",
        "scipy>=1.14",
        "joblib",
        "patsy",
        "tqdm",
        "six",
        "numba",
        "cffi>=1.0.0",
        "pyparsing",
    ]

classifiers = [
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Mathematics',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

[project.urls]
homepage = "http://research.tetonedge.net"
repository = "https://github.com/jdtuck/fdasrsf_python"
documentation = "https://fdasrsf-python.readthedocs.io/en/latest/"

[tool.cibuildwheel]
# Note: the below skip command doesn't do much currently, the platforms to
# build wheels for in CI are controlled in `.github/workflows/wheels.yml` and
# `tools/ci/cirrus_wheels.yml`.
# musllinux is skipped because 'crbfgs' cannot resolve BLAS there: the link
# against the staged libscipy_openblas.so succeeds, yet the module comes out with
# no BLAS in DT_NEEDED and no BLAS routines of its own, so it would fail at
# import with 'undefined symbol: dnrm2_' (and auditwheel has no dependency to
# vendor).  manylinux does record the dependency and is unaffected.  This is not
# a new break -- it predates the build_ext check that now catches it, so the
# musllinux wheels published before this were almost certainly already broken.
# Revisit by checking whether that .so exports the F77 symbols:
#   nm -D --defined-only /usr/local/lib/libscipy_openblas.so | grep dnrm2_
skip = "cp38-* *_i686 cp314t-* *_ppc64le *_s390x *-win32 *musllinux*"
build-verbosity = "3"

# FDASRSF_BLAS_LIB / FDASRSF_BLAS_DIR name the BLAS that setup.py links 'crbfgs'
# against; they must match what the corresponding before-build script stages.
# Linux and macOS need them because they stage scipy-openblas32, whose library is
# 'libscipy_openblas' and not one of the names setup.py would look for.  Windows
# needs neither: setup.py finds the mkl-devel wheel's mkl_rt itself, and mkl_rt
# carries LAPACK too, so no FDASRSF_LAPACK_LIB either (a BLAS that ships LAPACK
# separately, as conda-forge does, needs one -- see _find_lapack in setup.py).
[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-build = "bash {project}/bin/cibw_before_build_linux.sh {project}"
environment = {RUNNER_OS="Linux", FDASRSF_BLAS_LIB="scipy_openblas", FDASRSF_BLAS_DIR="/usr/local/lib"}

[tool.cibuildwheel.macos]
before-build = "bash {project}/bin/cibw_before_build_macos.sh {project}"
environment = {RUNNER_OS="macOS", MACOSX_DEPLOYMENT_TARGET=12.3, FDASRSF_BLAS_LIB="scipy_openblas", FDASRSF_BLAS_DIR="/usr/local/lib"}

[tool.cibuildwheel.windows]
before-build = "bash {project}/bin/cibw_before_build_win.sh {project}"
#repair-wheel-command = "bash ./bin/repair_windows.sh {wheel} {dest_dir}"
environment = {RUNNER_OS="Windows"}

[[tool.cibuildwheel.overrides]]
select = "*-win32"
environment = {PKG_CONFIG_PATH="/opt/32/lib/pkgconfig"}

[[tool.cibuildwheel.overrides]]
select = "*-win_amd64"
# can use pkg-config detection for win_amd64 because the installed rtools
# provide a working pkg-config.
# An alternative is to set CMAKE_PREFIX_PATH="c:/opt/openblas/if_32/32"
# Don't use double backslash for path separators, they don't get passed
# to the build correctly
# environment = { CMAKE_PREFIX_PATH="c:/opt/64" }
#environment = { PKG_CONFIG_PATH = "c:/opt/64/lib/pkgconfig" }

[build-system]
requires = ["setuptools>=83.0.0", "wheel", "cffi>=1.0.0", "Cython", "numpy"]  # PEP 518 - what is required to build
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--import-mode=importlib"
testpaths = [
    "tests",
]
